# Render Community Cloud Blueprint — deploy from GitHub.
# Dashboard → New → Blueprint → this repo. Set GROQ_API_KEY in the service env.

services:
  - type: web
    name: proof-carry-data-analyst
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
